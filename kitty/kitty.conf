# font
font_family Cascadia Code NF
font_size 12.0

# cursor
cursor_shape block
shell_integration no-cursor
cursor_trail 2
cursor_trail_decay 0.1 0.3
cursor_trail_start_threshold 0

# Catppuccin Frappe theme
foreground              #c6d0f5
background              #303446
cursor                  #f2d5cf
selection_foreground    #303446
selection_background    #8caaee

color0                  #51576d
color1                  #e78284
color2                  #a6d189
color3                  #e5c890
color4                  #8caaee
color5                  #f4b8e4
color6                  #81c8be
color7                  #b5bfe2
color8                  #626880
color9                  #e78284
color10                 #a6d189
color11                 #e5c890
color12                 #8caaee
color13                 #f4b8e4
color14                 #81c8be
color15                 #a5adce

# window config
# hide_window_decorations yes
window_padding_width 0 0 0 0
placement_strategy top-left
modify_font cell_height -1px

# key mapping
map alt+q quit
